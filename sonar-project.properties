# Métadonnées du projet
sonar.projectKey=Mspr
sonar.projectName=HealthIaCoach
sonar.projectVersion=1.0

# Sources à analyser (frontend, backend, ETL)
sonar.sources=Frontend/src,HealthIABack,Etl/dags

# Exclusions (dossiers à ignorer)
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/*.sql,**/migrations/**,**/coverage/**,**/dist/**

# Configuration Python
sonar.python.coverage.reportPaths=HealthIABack/coverage.xml
sonar.python.xunit.reportPath=HealthIABack/test-results.xml

# Configuration JavaScript/TypeScript (frontend)
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=Frontend/tsconfig.json

# Tests unitaires
sonar.test.inclusions=**/*Test*.py,**/*.test.js,**/*.test.tsx
sonar.testExecutionReportPaths=test-report.xml

# Qualité du code
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
